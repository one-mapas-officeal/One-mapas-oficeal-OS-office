name: Construir ISO

# Começa sozinho quando ISO/pedido-build.json muda (canal e versão vêm dele),
# ou pelo botão "Run workflow" (quando este arquivo estiver no branch principal).
on:
  push:
    paths:
      - ISO/pedido-build.json
  workflow_dispatch:
    inputs:
      canal:
        description: "Canal (alpha, beta, em-testes, estavel)"
        required: true
        default: beta
      versao:
        description: "Número da versão"
        required: true
        default: 0.1.0

permissions:
  contents: write

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ONEMAPAS_BASE: "Linux puro (kernel Linux + BusyBox), sem distribuição"
    steps:
      - uses: actions/checkout@v4

      - name: Canal e versão
        run: |
          git config --global user.name "OneMapas Bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CANAL="${{ inputs.canal }}"; VERSAO="${{ inputs.versao }}"
          else
            CANAL=$(python3 -c 'import json;print(json.load(open("ISO/pedido-build.json"))["canal"])')
            VERSAO=$(python3 -c 'import json;print(json.load(open("ISO/pedido-build.json"))["versao"])')
          fi
          echo "$CANAL $VERSAO" | grep -Eq '^[a-z-]+ [0-9A-Za-z.-]+$' || { echo "canal/versão inválidos"; exit 1; }
          echo "CANAL=$CANAL" >> "$GITHUB_ENV"
          echo "VERSAO=$VERSAO" >> "$GITHUB_ENV"
          echo "URL_BUILD=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_ENV"

      - name: Progresso, build iniciado
        run: |
          ./tools/progresso_ci.sh "construindo: iniciando" 70

      - name: Construir ISO
        env:
          ONEMAPAS_PROGRESSO: ${{ github.workspace }}/tools/progresso_ci.sh
        run: sudo -E ./os/build-iso.sh "$CANAL" "$VERSAO" && sudo chown -R "$USER" out

      - name: Publicar nos Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="iso-$CANAL-$VERSAO"
          ISO=$(ls out/*.iso)
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "OneMapas OS $VERSAO ($CANAL)" --prerelease \
            --notes "ISO gerada automaticamente pelo GitHub Actions. Pasta: ISO/$CANAL/$VERSAO/"
          gh release upload "$TAG" "$ISO" "$ISO.sha256" --clobber
          echo "URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$ISO")" >> "$GITHUB_ENV"

      - name: Progresso, pronta
        run: ./tools/progresso_ci.sh "pronta" 100 out/*.iso "$URL"

      - name: Progresso, falhou
        if: failure()
        run: ./tools/progresso_ci.sh "falhou (veja o log do build)" 70 || true
