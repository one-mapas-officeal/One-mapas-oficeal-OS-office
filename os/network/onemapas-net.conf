# /etc/modprobe.d/onemapas-net.conf: ajustes dos drivers de rede do OneMapas OS
# Intel Wi-Fi: desliga a economia de energia (evita quedas de conexão)
options iwlwifi power_save=0
options iwlmvm power_scheme=1
# Realtek Wi-Fi: desliga ASPM (evita travamentos em alguns notebooks)
options rtw88_pci disable_aspm=1
options rtw89_pci disable_clkreq=y disable_aspm_l1=y disable_aspm_l1ss=y
# Broadcom: usa o driver aberto brcmfmac em vez do proprietário wl
blacklist wl
