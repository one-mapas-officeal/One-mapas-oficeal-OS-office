# Render: publica a pasta sites/ em onemapasoficeal.com.br
# sites/oi/index.html  ->  https://onemapasoficeal.com.br/oi
services:
  - type: web
    runtime: static
    name: onemapas-sites
    branch: main
    buildCommand: "echo sites prontos"
    staticPublishPath: ./sites
    autoDeploy: true
    domains:
      - onemapasoficeal.com.br
    headers:
      - path: /*
        name: X-Powered-By
        value: OneMapas OS
