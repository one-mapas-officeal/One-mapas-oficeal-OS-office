# Render: GATEWAY do OneMapas OS (a ponte entre os visitantes e os PCs)
#   https://onemapasos.oficeal.com                 -> portal + API
#   https://<nome>.onemapasos.oficeal.com/?...     -> site que roda no PC do dono
# Visitante -> Render -> PC do dono -> Render -> visitante
services:
  - type: web
    runtime: python
    name: onemapas-gateway
    plan: starter   # o plano free "dorme" e derruba os túneis; use starter ou maior
    branch: main
    buildCommand: python3 --version
    startCommand: python3 os/render/gateway.py
    healthCheckPath: /api/status
    autoDeploy: true
    buildFilter:
      ignoredPaths:
        - ISO/**
    domains:
      - onemapasos.oficeal.com
      - "*.onemapasos.oficeal.com"
    envVars:
      - key: ONEMAPAS_DOMINIO_SITES
        value: onemapasos.oficeal.com
      # Supabase (projeto Mapasos): tabela public.sites + bucket "sites"
      - key: SUPABASE_URL
        value: https://iahcymwrsmbagapktstu.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false   # cole no painel do Render: Supabase > Project Settings > API Keys > secret key
      - key: GITHUB_REPO
        value: one-mapas-officeal/One-mapas-oficeal-OS-office
      - key: GITHUB_BRANCH
        value: main
